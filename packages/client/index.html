    <!--
      Link preview card: what LINE, Discord, WhatsApp, X and the like show when
      someone pastes a link. These are the site's default values. For /join/CODE
      and /u/NAME links the server swaps the title, description and url in the
      tags below (packages/server/src/preview.ts), so keep each one on its own
      line, with name or property first and then content.
    -->
    <meta name="description" content="Real-time multiplayer Minesweeper where finding the mines scores points: take turns with friends by room link, get matched with strangers by Elo, or play AI opponents, right in your browser, no install." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111315" />

    <meta property="og:type" content="website" />

    <meta property="og:image:height" content="630" />
